pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'net.fabricmc.fabric-loom' version "${loom_version}"
		id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	}
}

rootProject.name = 'hide-password'

// Каждая папка versions/<mc> — отдельная сборка под свою версию Minecraft.
file('versions').eachDir { dir ->
	include ":${dir.name}"
	project(":${dir.name}").projectDir = dir
}
