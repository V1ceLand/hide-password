plugins {
	id 'net.fabricmc.fabric-loom' apply false
	id 'net.fabricmc.fabric-loom-remap' apply false
}

def commonDir = file('common/src/main')

subprojects {
	def obfuscated = project.property('obfuscated').toBoolean()
	apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

	def mc = project.minecraft_version
	def javaVersion = project.java_version as int

	version = "${rootProject.mod_version}+mc${mc}"
	group = rootProject.maven_group
	base.archivesName = rootProject.archives_base_name

	sourceSets.main {
		java.srcDir(new File(commonDir, 'java'))
		resources.srcDir(new File(commonDir, 'resources'))
	}

	dependencies {
		minecraft "com.mojang:minecraft:${mc}"
		if (obfuscated) {
			mappings loom.officialMojangMappings()
			modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		} else {
			implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		}
	}

	loom {
		runs.configureEach {
			// ./gradlew :<mc>:runClient -Pselftest — проверка, что все миксины применяются.
			if (project.hasProperty('selftest')) {
				vmArg '-Dhidepassword.selftest=true'
			}
		}
	}

	processResources {
		def props = [
			version        : rootProject.mod_version,
			minecraft_range: project.minecraft_range,
			loader_min     : project.loader_min,
			java_version   : project.java_version,
		]
		inputs.properties props
		filesMatching('fabric.mod.json') {
			expand props
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = javaVersion
		options.encoding = 'UTF-8'
	}

	java {
		sourceCompatibility = JavaVersion.toVersion(javaVersion)
		targetCompatibility = JavaVersion.toVersion(javaVersion)
	}

	jar {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${rootProject.archives_base_name}" }
		}
	}

	// Готовые jar всех версий собираются в build/release/ корня проекта.
	def releaseJar = obfuscated ? tasks.named('remapJar') : tasks.named('jar')
	tasks.register('collectRelease', Copy) {
		from releaseJar
		into rootProject.layout.buildDirectory.dir('release')
	}
	tasks.named('build') { finalizedBy 'collectRelease' }
}
